server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/ddv;
    server_tokens off;
 
    gzip on;
    gzip_types application/javascript text/css application/json;
 
    add_header X-Content-Type-Options nosniff always;
 
    # Health check: 200 when the library file is present, 503 otherwise
    location = /health {
        access_log off;
        default_type application/json;
        if (!-f $document_root/ptx-ddv.js) {
            return 503 '{"status":"unavailable"}\n';
        }
        return 200 '{"status":"ok"}\n';
    }
 
    # The library keeps the same file name across versions,
    # so browsers revalidate it instead of caching it blindly
    location = /ptx-ddv.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
 
    # Everything else: serve the file if it exists, otherwise 404
    location / {
        try_files $uri =404;
    }
}