version: '3.8'

services:
  ddv:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
  
  # Test suite: docker compose run --rm tests
  tests:
    build:
      context: .
      target: build
    command: ["npm", "test"]
    # The profile keeps it out of `docker compose up`.
    profiles: ["test"]
